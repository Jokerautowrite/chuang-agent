[package]
name = "chuang-agent"
version = "0.1.0"
edition = "2021"
description = "Cross-platform local agent operating system with durable memory, governance, and replaceable runtimes"
license-file = "LICENSE"
repository = "https://github.com/Jokerautowrite/chuang-agent"
readme = "README.md"
keywords = ["agent", "memory", "orchestration", "governance", "local-first"]
categories = ["command-line-utilities"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "std"] }
crossterm = "0.28"
ratatui = "0.30"
bytes = "1"
fs2 = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["native-tokio", "webpki-tokio", "http1", "tls12", "logging", "ring"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
ed25519-dalek = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
rusqlite = { version = "0.31", features = ["bundled"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
toml = "0.8"

[lints.clippy]
# 内部调度函数参数多（>7）是领域特性，重构为参数结构体会大改调用面；
# 大型状态枚举字段差异大属正常，均显式 allow，其余 lint 保持默认严格。
too_many_arguments = "allow"
large_enum_variant = "allow"
