# Simple Chuang Agent config.
# Keep secrets out of this file. Use provider.api_key_env for real providers.

db_path = "./data/chuang-agent.db"
recall_limit = 5
identity_memory_root = "./data/hermes-memory"
subagent = "fake"
subagent_queue_root = "./data/subagent-queue"

[provider]
kind = "fake"
id = "fake-runtime"
model = "stub-responder"

# For a real OpenAI-compatible provider:
# kind = "openai_compatible"
# id = "local-openai-compatible"
# base_url = "http://127.0.0.1:8000/v1"
# model = "gpt-5.5"
# api_key_env = "CHUANG_AGENT_API_KEY"
# transport = "stub"

[context]
max_tokens = 512
reserve_system_tokens = 32
min_working_tokens = 1
max_tool_results = 5
max_memory_segments = 5
